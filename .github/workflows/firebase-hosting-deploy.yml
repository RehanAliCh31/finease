name: Firebase Hosting Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy live hosting
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      FIREBASE_PROJECT_ID: finease-27a62
      MODELS_API_TOKEN: ${{ secrets.MODELS_API_TOKEN }}
      GITHUB_MODELS_TOKEN: ${{ secrets.GITHUB_MODELS_TOKEN }}
      GITHUB_MODELS_MODEL: ${{ vars.GITHUB_MODELS_MODEL }}
      AI_PROXY_URL: ${{ vars.AI_PROXY_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.9"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build web release
        shell: bash
        run: |
          build_args=(
            "--dart-define=GITHUB_MODELS_MODEL=${GITHUB_MODELS_MODEL:-openai/gpt-4o-mini}"
          )
          models_token="${GITHUB_MODELS_TOKEN:-$MODELS_API_TOKEN}"

          if [ -n "$AI_PROXY_URL" ]; then
            build_args+=("--dart-define=AI_PROXY_URL=$AI_PROXY_URL")
          elif [ -n "$models_token" ]; then
            echo "::warning::Embedding a GitHub Models token in a web build is only acceptable for a private demo. Prefer AI_PROXY_URL for production."
            build_args+=("--dart-define=GITHUB_MODELS_TOKEN=$models_token")
            build_args+=("--dart-define=MODELS_API_TOKEN=$models_token")
          else
            echo "::warning::No AI_PROXY_URL, GITHUB_MODELS_TOKEN, or MODELS_API_TOKEN configured. AI features will show a configuration message."
          fi

          flutter build web --release "${build_args[@]}"

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FINEASE_27A62 }}
          projectId: ${{ env.FIREBASE_PROJECT_ID }}
          channelId: live
